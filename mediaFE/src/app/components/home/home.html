<div class="container" style="margin-top: 70px;">
    <div class="row">
        <div class="col-sm-12">
            <h1>Media Asset Manager</h1>
            <p>
                Keep track of your media files, which project they belong to
                and which drive they are stored on.
            </p>
            @if (auth.loggedIn()) {
            <a class="btn btn-primary" [routerLink]="['/projects']">Go to my projects</a>
            } @else {
            <a class="btn btn-primary" [routerLink]="['/login']">Login</a>
            }
        </div>
    </div>
</div>
