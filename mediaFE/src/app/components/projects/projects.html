<div class="container" style="margin-top: 70px;">
    <div class="row">
        <div class="col-sm-12">
            <h2>Projects</h2>
        </div>
    </div>
    <div class="row">
        @for (project of project_list; track $index) {
        <div class="col-sm-4">
            <div class="card text-white bg-primary mb-3" style="cursor: pointer;"
                [routerLink]="['/projects', project._id]">
                <div class="card-header">{{ project.title }}</div>
                <div class="card-body">
                    <p class="card-text">Region: {{ project.target_region }}</p>
                </div>
                <div class="card-footer">{{ project.status }}</div>
            </div>
        </div>
        }
    </div>
    <div class="row">
        <div class="col-sm-12">
            <button class="btn btn-primary" (click)="previousPage()" [disabled]="page <= 1">Previous</button>
            Page {{ page }}
            <button class="btn btn-primary" (click)="nextPage()" [disabled]="isLastPage">Next</button>
        </div>
    </div>
</div>
